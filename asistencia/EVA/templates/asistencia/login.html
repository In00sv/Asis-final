{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow p-4">

            <h1 class="mb-4">
                Iniciar Sesión
            </h1>


            {% if error %}

                <div class="alert alert-danger">
                    {{ error }}
                </div>

            {% endif %}


            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label
                        for="username"
                        class="form-label"
                    >
                        Usuario
                    </label>

                    <input
                        type="text"
                        name="username"
                        id="username"
                        class="form-control"
                        required
                        autocomplete="username"
                    >

                </div>


                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Contraseña
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        class="form-control"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Ingresar
                </button>

            </form>


            <div class="text-center mt-3">

                <a href="{% url 'registro' %}">
                    Crear una cuenta
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
